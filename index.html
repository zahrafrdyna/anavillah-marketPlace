<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Market Place</h1>
      <nav>
        <a href="#produk">Produk</a>
        <a href="#kontak">Kontak</a>
        <a href="#" class="cart-link"
          >Keranjang (<span id="cart-cont">0</span>)</a
        >
      </nav>
    </header>
    <main id="produk">
      <div class="product-grid">
        <div class="product-card">
          <img src="puma.jpg" alt="sepatu puma" />
          <h3>Puma Speedcat OG</h3>
          <p class="price">Rp 1.900.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-min">-</button>
            <input type="text" class="qty-value" value="0" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button class="buy-btn" data-nama="sepatu puma" data-harga="1900000">
            Beli Sekarang
          </button>
        </div>
        <div class="product-card">
          <img src="adidas samba.jpg" alt="Adidas Samba Jane" />
          <h3>Adidas Samba Jane</h3>
          <p class="price">Rp 2.300.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-min">-</button>
            <input type="text" class="qty-value" value="0" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button class="buy-btn" data-nama="Adidas Samba Jane" data-harga="2300000">
            Beli Sekarang
          </button>
        </div>
        <div class="product-card">
          <img src="puma2.jpg" alt=" Puma Speedcat Ballet Suede " />
          <h3> Puma Speedcat Ballet Suede </h3>
          <p class="price">Rp 1.200.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-min">-</button>
            <input type="text" class="qty-value" value="0" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button
            class="buy-btn"
            data-nama="Puma Speedcat Ballet Suede"
            data-harga="1200000"
          >
            Beli Sekarang
          </button>
        </div>
        <div class="product-card">
          <img src="New Bellence.jpg" alt="New Balance 530" />
          <h3>New Balance 530</h3>
          <p class="price"> Rp 1.900.000 </p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-min">-</button>
            <input type="text" class="qty-value" value="0" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button class="buy-btn" data-nama="New Balance 530" data-harga="1900000">
            Beli Sekarang
          </button>
        </div>
        
        <div class="product-card">
          <img src="adidas samba2.png" alt="Adidas Consortium Cup Past END" />
          <h3>Adidas Consortium Cup Past END</h3>
          <p class="price">Rp 2.100.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-min">-</button>
            <input type="text" class="qty-value" value="0" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button
            class="buy-btn"
            data-nama="Adidas Consortium Cup Past END"
            data-harga="2100000"
          >
            Beli Sekarang
          </button>
        </div>
      </div>
    </main>
    <footer id="kontak">
      <h3>Hubungi Kami</h3>
      <form class="contact-form">
        <label for="nama">Nama:</label>
        <input type="text" id="nama" placeholder="Nama lengkap" />

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Email aktif" />

        <label for="pesan">Pesan:</label>
        <textarea id="pesan" placeholder="Tulis pesan..."></textarea>

        <button type="submit">Kirim Pesan</button>
      </form>
      <p>copyright 2026 by Anavillah Humaidah</p>
    </footer>
    <script src="./script.js"></script>
  </body>
</html>
